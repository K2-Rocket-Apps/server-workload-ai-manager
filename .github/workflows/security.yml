name: security

on:
  push:
    branches: [develop, qa, main]
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  security:
    uses: K2-Rocket-Apps/ci-workflows/.github/workflows/security.yml@v1
    with:
      # TypeScript/pnpm repo, no PHP/Composer code: skip only the Composer
      # steps; npm audit, Semgrep and TruffleHog still run.
      stack: none
    # Explicit, never inherit. These feed only the Composer steps, which
    # stack: none skips.
    secrets:
      FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
      FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
      COMPOSER_GITHUB_TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
